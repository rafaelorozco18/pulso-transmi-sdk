name: pulso-transmi-pipeline

on:
  schedule:
    # GitHub Actions ejecuta cron en UTC. Corre cada hora, cinco minutos después.
    - cron: "5 * * * *"
  workflow_dispatch:

concurrency:
  group: pulso-transmi-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install collector dependencies
        run: python -m pip install -e '.[ml,dev]'

      - name: Test collector
        run: pytest -q

      - name: Collect newly released observations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python pipeline/bootstrap_supabase.py --stream

      - name: Infer and submit the open forecast cycle
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python pipeline/run_inference.py

      - name: Monitor performance and leaderboard
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
        run: python pipeline/monitor_performance.py
