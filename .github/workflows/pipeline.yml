name: pulso-transmi-pipeline

# Colector → inferencia (POST) → desempeño → reentrenamiento, en cada ciclo.
#
# Los ciclos se abren cada ~30 min y cierran ~25 min después, y el cron de
# GitHub se retrasa o se salta ejecuciones. Por eso el job no hace una pasada
# y termina: corre `pipeline/watch.py`, que sondea la API durante
# schedule.watch_minutes (pipeline/config.toml) y, al terminar, se relanza con
# workflow_dispatch. El cron horario solo re-arranca la cadena si se corta.

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: pulso-transmi-pipeline
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pipeline dependencies
        run: python -m pip install -e '.[ml]'

      - name: Watch forecast cycles and run the MLOps stages
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PYTHONWARNINGS: ignore
        run: python pipeline/watch.py

      - name: Relaunch the watcher
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pipeline.yml --ref main -R "${{ github.repository }}"
