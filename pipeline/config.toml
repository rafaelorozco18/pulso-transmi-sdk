# Configuración del pipeline MLOps. Cambiar frecuencias o umbrales aquí no
# requiere tocar código. Las horas "virtuales" se miden con el reloj de la
# competencia (data_cutoff), no con la hora real.

[schedule]
# El vigilante consulta /v1/forecast-cycles/current con esta frecuencia (s).
# Hoy el reloj avanza 30 min virtuales cada 30 min reales, pero solo abre ciclo
# en cada hora virtual en punto (uno por hora real), abierto ~25 min.
poll_seconds = 45
cycle_every_minutes = 60   # cadencia virtual de ciclos (para medir cobertura)
# Duración de cada job de GitHub Actions; debe quedar bajo el límite de 360 min.
watch_minutes = 330
# No se intenta un POST si faltan menos de estos segundos para el cierre.
submit_margin_seconds = 20

[model]
# Receta del forecaster adaptativo (ver src/pulso_transmi/forecasting.py).
lookback_slots = 4
decay = 0.8
max_abs_log_ratio = 1.0
train_half_life_days = 14

[performance]
window_hours = 24          # ventana rolling (virtual) para accuracy y drift
accuracy_alert = 82.0      # alerta si la accuracy rolling cae bajo este valor
bias_alert = 0.10          # alerta si |log(real/perfil)| medio de una estación lo supera
bias_alert_stations = 2    # estaciones en alerta de sesgo necesarias para disparar drift
min_predictions = 96       # evaluaciones mínimas antes de confiar en la señal
# Data drift (pipeline/drift.py): demanda de la ventana vs. la que vio el campeón.
reference_days = 14        # días finales del entrenamiento del campeón usados como referencia
psi_bins = 10              # deciles de log(demanda) de la referencia
psi_alert = 0.25           # PSI > 0,25 = cambio mayor de distribución (0,10–0,25 moderado)
shape_alert = 0.10         # distancia de variación total de la forma horaria (ruido base ≈ 0,04)
data_alert_stations = 2    # estaciones en alerta necesarias para disparar drift

[retraining]
# Se evalúa en cada ciclo (≈ cada hora). Dispara si la accuracy rolling de lo
# enviado cae bajo accuracy_below, si la etapa de desempeño levanta drift
# (datos, concepto o desempeño) o si el campeón lleva every_hours sin evaluarse.
accuracy_below = 83.0      # umbral mínimo de accuracy rolling 24 h (métrica oficial)
cooldown_hours = 1         # horas virtuales mínimas entre evaluaciones (1 = cada ciclo)
every_hours = 24           # reentrenamiento programado aunque todo esté bien
eval_hours = 8             # ventana de backtest por ciclos simulados (sin fuga); corta para reaccionar
                           # rápido a un cambio de régimen (24 h mezclaba el patrón viejo con el nuevo)
min_gain = 0.05            # puntos de accuracy que el candidato debe ganarle al campeón
min_accuracy = 70.0        # piso absoluto para promover

# Recetas candidatas: en cada reentrenamiento se ajustan todas con los datos
# anteriores a la ventana, se comparan en ciclos simulados y la mejor reemplaza
# al campeón solo si le gana. Memoria del perfil (vida media / ventana) y ancla
# de nivel (anchor_slots: 48 = 12 h, 96 = 24 h) para drift de tendencia, y
# estacionalidad corta (season_slots = -1: detecta el período en cada corte;
# season_cycles: períodos promediados) para cuando la demanda deja de seguir
# el ciclo diario y se repite con otro período.
[[retraining.candidates]]
name = "hl14"
train_half_life_days = 14

[[retraining.candidates]]
name = "hl5"
train_half_life_days = 5

[[retraining.candidates]]
name = "win7"
train_window_days = 7

[[retraining.candidates]]
name = "hl14-a24"
train_half_life_days = 14
anchor_slots = 96

[[retraining.candidates]]
name = "hl5-a24"
train_half_life_days = 5
anchor_slots = 96

[[retraining.candidates]]
name = "hl5-a12"
train_half_life_days = 5
anchor_slots = 48

[[retraining.candidates]]
name = "seas-k2"
season_slots = -1
season_cycles = 2

[[retraining.candidates]]
name = "seas-k3"
season_slots = -1
season_cycles = 3

[[retraining.candidates]]
name = "seas-k4"
season_slots = -1
season_cycles = 4

[[retraining.candidates]]
name = "seas-k6"
season_slots = -1
season_cycles = 6
